<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Fluton — motion</title>
<style>
@font-face{font-family:SG;font-weight:700;src:url(assets/sg700.ttf)}
@font-face{font-family:SG;font-weight:500;src:url(assets/sg500.ttf)}
@font-face{font-family:JB;font-weight:500;src:url(assets/jb500.ttf)}
@font-face{font-family:JB;font-weight:800;src:url(assets/jb800.ttf)}
html,body{margin:0;background:#000;height:100%;overflow:hidden}
canvas{display:block;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;margin:auto}
</style></head><body><canvas id="c" width="1920" height="1080"></canvas>
<script>
"use strict";
const W=1920,H=1080,CX=W/2,CY=H/2,TAU=Math.PI*2;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const B=0.46875,DUR=32,bt=n=>n*B;
const C={bg:'#04060C',ice:'#89DDFF',blue:'#7AA2F7',vio:'#BB9AF7',ink:'#F4F8FF',dim:'#51597D',red:'#FF4D6D',soft:'#C0CAF5'};
const cl=(v,a=0,b=1)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const p=(t,a,d)=>cl((t-a)/d);
const E={
  oc:t=>1-(1-t)**3, ic:t=>t*t*t, ioc:t=>t<.5?4*t*t*t:1-(-2*t+2)**3/2,
  oe:t=>t>=1?1:1-2**(-10*t), ie:t=>t<=0?0:2**(10*t-10),
  ob:t=>1+2.70158*(t-1)**3+1.70158*(t-1)**2, oq:t=>1-(1-t)**5,
  ob2:t=>1+4.2*(t-1)**3+3.2*(t-1)**2
};
const rnd=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s);};
const hexA=(h,a)=>{const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`;};
const img={};['logo','logoA','logoB','logoC'].forEach(k=>{img[k]=new Image();img[k].src='assets/'+k+'.png';});
let GA=1; const al=a=>{ctx.globalAlpha=cl(GA*a);};

/* ---------- text ---------- */
function font(size,fam='SG',wt=700){ctx.font=`${wt} ${size}px ${fam}`;}
function txt(s,x,y,size,o={}){
  font(size,o.fam||'SG',o.wt||700);ctx.letterSpacing=(o.ls||0)+'px';
  ctx.textAlign=o.align||'center';ctx.textBaseline=o.base||'middle';
  if(o.glow){ctx.shadowColor=o.glow;ctx.shadowBlur=o.blur||40;}
  if(o.stroke){ctx.lineWidth=o.lw||3;ctx.strokeStyle=o.stroke;ctx.lineJoin='round';ctx.strokeText(s,x,y);}
  if(o.color!==null){ctx.fillStyle=o.color||C.ink;ctx.fillText(s,x,y);}
  ctx.shadowBlur=0;ctx.shadowColor='transparent';ctx.letterSpacing='0px';
}
function tw(s,size,o={}){font(size,o.fam||'SG',o.wt||700);ctx.letterSpacing=(o.ls||0)+'px';const w=ctx.measureText(s).width;ctx.letterSpacing='0px';return w-(o.ls||0);}
/* word rising out of a mask */
function rise(s,x,y,size,q,o={}){
  if(q<=0)return;const e=E.oe(q),h=size*1.25;
  ctx.save();ctx.beginPath();ctx.rect(0,y-h/2,W,h);ctx.clip();
  txt(s,x,y+(1-e)*h,size,o);ctx.restore();
}
/* punch-in: overscale to 1 */
function punch(s,x,y,size,q,o={}){
  if(q<=0)return;const e=E.oe(q),sc=lerp(o.from||1.5,1,e);
  ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);const g=ctx.globalAlpha;ctx.globalAlpha=g*cl(q*5);
  txt(s,0,0,size,o);ctx.restore();ctx.globalAlpha=g;
}
/* per-letter staggered rise, left aligned at x */
function letters(s,x,y,size,u,o={}){
  const st=o.stag||0.04,d=o.d||0.45,ls=o.ls||0;let cx=x;const h=size*1.3;
  font(size,o.fam||'SG',o.wt||700);
  ctx.save();ctx.beginPath();ctx.rect(0,y-h/2,W,h);ctx.clip();
  [...s].forEach((ch,i)=>{const w=ctx.measureText(ch).width,q=p(u,i*st,d);
    if(q>0){txt(ch,cx,y+(1-E.oe(q))*h,size,{...o,align:'left',ls:0});font(size,o.fam||'SG',o.wt||700);}
    cx+=w+ls;});
  ctx.restore();
}
const lettersW=(s,size,o={})=>{font(size,o.fam||'SG',o.wt||700);return [...s].reduce((a,ch)=>a+ctx.measureText(ch).width+(o.ls||0),0)-(o.ls||0);};
const GL='█▓▒░#$%&@<>/\\0123456789ABCDEF';
function cipher(s,q,t,seed=0){ // q: fraction of chars encrypted
  let out='';const n=s.length;
  for(let i=0;i<n;i++){const ch=s[i];
    if(ch===' '||i/n>=q){out+=ch;continue;}
    out+=GL[Math.floor(rnd(i*7.3+seed+Math.floor(t/0.07)*13.7)*GL.length)];}
  return out;
}
const typed=(s,q)=>s.slice(0,Math.round(s.length*cl(q)));

/* ---------- shapes ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function ring(x,y,r,lw,col,a=1){if(r<=0||a<=0)return;al(a);ctx.lineWidth=lw;ctx.strokeStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.stroke();al(1);}
function orb(x,y,r,col,a=1){if(r<=0||a<=0)return;const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,hexA(col,a));g.addColorStop(1,hexA(col,0));ctx.fillStyle=g;ctx.fillRect(x-r,y-r,2*r,2*r);}
function shock(x,y,u,col=C.ice,max=1300,d=0.9){const q=p(u,0,d);if(q<=0||q>=1)return;
  ring(x,y,E.oe(q)*max,lerp(26,1,q),col,(1-q)*0.8);ring(x,y,E.oc(q)*max*0.62,lerp(10,1,q),C.ink,(1-q)*0.5);}
function burst(x,y,u,n=70,col=C.ice,d=0.7){const q=p(u,0,d);if(q<=0||q>=1)return;
  ctx.lineCap='round';
  for(let i=0;i<n;i++){const a=rnd(i+3)*TAU,sp=0.5+rnd(i+77),r1=E.oe(q)*1250*sp,r0=r1-lerp(260,20,q)*sp;
    al((1-q)*(0.35+0.65*rnd(i+5)));ctx.strokeStyle=i%3?col:C.ink;ctx.lineWidth=1.5+rnd(i+31)*3.5;
    ctx.beginPath();ctx.moveTo(x+Math.cos(a)*Math.max(60,r0),y+Math.sin(a)*Math.max(60,r0));ctx.lineTo(x+Math.cos(a)*r1,y+Math.sin(a)*r1);ctx.stroke();}
  al(1);}
/* logo: parts A (roof chevron) B (inner chevron) C (ring) — a,b,c are 0..1 assemble progress */
function logo(x,y,size,a=1,b=1,c=1,o={}){
  const s=size/512;ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.translate(-256,-256);
  if(o.glow){ctx.shadowColor=o.glow;ctx.shadowBlur=o.blur||50;}
  const g=ctx.globalAlpha;
  if(a>0){const e=E.ob(a);ctx.globalAlpha=g*cl(a*4);ctx.drawImage(img.logoA,0,(e-1)*900);}
  if(b>0){const e=E.ob(b);ctx.globalAlpha=g*cl(b*4);ctx.drawImage(img.logoB,(e-1)*900,0);}
  if(c>0){const e=E.oe(c),sc=lerp(5,1,e);ctx.globalAlpha=g*cl(c*3);
    ctx.translate(344,358);ctx.rotate((1-e)*-5);ctx.scale(sc,sc);ctx.translate(-344,-358);ctx.drawImage(img.logoC,0,0);}
  ctx.restore();ctx.globalAlpha=g;
}
/* ---------- background ---------- */
function backdrop(t,tint=C.blue,warp=0.08,streak=0,ox=CX,oy=CY){
  ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
  orb(ox,oy,1150,tint,0.16);orb(ox+Math.cos(t*0.5)*380,oy+Math.sin(t*0.4)*200,620,C.vio,0.07);
  ctx.lineCap='round';
  for(let i=0;i<150;i++){
    const a=rnd(i)*TAU,sp=0.35+rnd(i+9),r=((rnd(i+50)+t*warp*sp)%1+1)%1,d=60+r*r*1250;
    const x=ox+Math.cos(a)*d,y=oy+Math.sin(a)*d*0.8;
    al(r*(0.25+0.6*rnd(i+4)));
    if(streak>0){const d0=d-streak*r*sp*220;ctx.strokeStyle=i%4?C.soft:C.ice;ctx.lineWidth=1+r*2.2;
      ctx.beginPath();ctx.moveTo(ox+Math.cos(a)*d0,oy+Math.sin(a)*d0*0.8);ctx.lineTo(x,y);ctx.stroke();}
    else{ctx.fillStyle=i%4?C.soft:C.ice;ctx.beginPath();ctx.arc(x,y,0.8+r*2,0,TAU);ctx.fill();}
  }
  al(1);
}
function sec(num,label,u,exit=1){ // section header, top-left
  const q=E.oe(p(u,0.05,0.5))*exit;if(q<=0)return;
  al(q);txt(num,120+(1-q)*-60,128,120,{align:'left',color:null,stroke:hexA(C.ice,0.9),lw:2.5});
  ctx.fillStyle=C.ice;ctx.fillRect(290,128-2,E.oe(p(u,0.15,0.5))*90,4);
  txt(typed(label,p(u,0.2,0.45)),404,130,30,{fam:'JB',wt:500,align:'left',ls:8,color:C.soft});
  logo(W-150,128,84,1,1,1);al(q*0.7);
  txt('FLUTON',W-216,130,26,{align:'right',ls:9,color:C.soft});al(1);
}

/* ================= SCENE 1 — everything is public (beats 0–8) ================= */
const TOK=['ETH','USDC','WBTC','SOL','USDT','ARB','AVAX','MON'];
const hx=(s,n)=>{let o='';for(let i=0;i<n;i++)o+='0123456789abcdef'[Math.floor(rnd(s+i*3.1)*16)];return o;};
function txRow(k){const amt=(rnd(k+1)*rnd(k+2)*90000+12).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
  return `0x${hx(k,4)}…${hx(k+40,4)} → 0x${hx(k+80,4)}…${hx(k+120,4)}  ${amt} ${TOK[Math.floor(rnd(k+5)*TOK.length)]}`;}
function s1(t){
  const u=t;
  ctx.fillStyle='#05060A';ctx.fillRect(0,0,W,H);orb(CX,CY,1200,C.red,0.07+0.05*p(u,bt(4),0.3));
  if(u<bt(5)){
    // ledger wall
    const rh=48,sc=u*70;
    for(let c=0;c<3;c++)for(let r=-1;r<25;r++){
      const row=r+Math.floor(sc/rh),k=row*17+c*1000,y=r*rh-(sc%rh)+20,x=70+c*630;
      const hot=rnd(k+Math.floor(u/0.234)*9.1)>0.86;
      al(hot?0.95:0.26);txt(txRow(k),x,y,21,{fam:'JB',wt:500,align:'left',color:hot?C.red:C.soft});
      if(hot){al(0.9);ctx.fillStyle=C.red;ctx.fillRect(x-22,y-8,10,16);}
    }
    al(1);
    const sy=((u*0.9)%1)*H;const g=ctx.createLinearGradient(0,sy-140,0,sy);
    g.addColorStop(0,hexA(C.red,0));g.addColorStop(1,hexA(C.red,0.22));ctx.fillStyle=g;ctx.fillRect(0,sy-140,W,140);
    ctx.fillStyle=hexA(C.red,0.9);ctx.fillRect(0,sy,W,2);
    // headline plate
    const g2=ctx.createRadialGradient(CX,CY,100,CX,CY,900);g2.addColorStop(0,'rgba(5,6,10,0.94)');g2.addColorStop(0.6,'rgba(5,6,10,0.8)');g2.addColorStop(1,'rgba(5,6,10,0)');
    ctx.fillStyle=g2;ctx.fillRect(0,0,W,H);
    const S=176,w1=tw('EVERY',S),w2=tw('TRADE',S),gap=52,x0=CX-(w1+gap+w2)/2;
    rise('EVERY',x0,300,S,p(u,bt(0)+0.02,0.4),{align:'left'});
    rise('TRADE',x0+w1+gap,300,S,p(u,bt(1),0.4),{align:'left'});
    const w3=tw('YOU',S),w4=tw('MAKE',S),x1=CX-(w3+gap+w4)/2;
    rise('YOU',x1,490,S,p(u,bt(2),0.4),{align:'left'});
    rise('MAKE',x1+w3+gap,490,S,p(u,bt(3),0.4),{align:'left'});
    const q=p(u,bt(4),0.35);
    if(q>0){ctx.fillStyle=C.red;const bw=E.oe(q)*1180;ctx.fillRect(CX-bw/2,620,bw,250);
      punch('IS PUBLIC.',CX,750,214,q,{color:'#05060A',from:1.6});}
    al(0.75);txt(typed('PUBLIC MEMPOOL  ·  LIVE',p(u,0.1,0.5)),CX,150,24,{fam:'JB',wt:500,ls:10,color:C.red});
    if(Math.floor(u/0.234)%2===0){ctx.fillStyle=C.red;ctx.beginPath();ctx.arc(CX-250,150,7,0,TAU);ctx.fill();}
    al(1);
  }else{
    // three hard-cut words
    const words=['WATCHED.','COPIED.','FRONT-RUN.'],i=Math.min(2,Math.floor((u-bt(5))/B)),lu=u-bt(5+i);
    const inv=i===1;ctx.fillStyle=inv?C.red:'#05060A';ctx.fillRect(0,0,W,H);
    if(!inv)orb(CX,CY,1000,C.red,0.2);
    const q=p(lu,0,0.3),col=inv?'#05060A':(i===2?C.red:C.ink);
    // echo lines
    for(let k=1;k<=3;k++){al(0.13*(1-p(lu,0,0.45)));txt(words[i],CX,CY+k*150*E.oe(q),300-i*26,{color:null,stroke:col,lw:2});txt(words[i],CX,CY-k*150*E.oe(q),300-i*26,{color:null,stroke:col,lw:2});}
    al(1);punch(words[i],CX,CY,300-i*26,q,{color:col,from:1.45});
    // glitch slices
    for(let k=0;k<4;k++){const on=rnd(k+Math.floor(u/0.05)*3.3+i)>0.72;if(!on)continue;
      const y=380+rnd(k*9+Math.floor(u/0.05))*320,hh=14+rnd(k+2)*40,dx=(rnd(k+Math.floor(u/0.05)*1.7)-0.5)*120;
      ctx.drawImage(cv,0,y,W,hh,dx,y,W,hh);}
    // CRT collapse into the drop
    const z=p(u,bt(7.45),B*0.55);
    if(z>0){const e=E.ic(z);ctx.fillStyle='#000';const hh=H/2*e;ctx.fillRect(0,0,W,hh);ctx.fillRect(0,H-hh,W,hh+1);
      if(z>0.8){const zz=(z-0.8)/0.2;ctx.fillRect(0,0,CX*zz,H);ctx.fillRect(W-CX*zz,0,CX*zz+1,H);}
      al(z);ctx.fillStyle='#fff';ctx.fillRect(CX*E.ic(p(z,0.8,0.2)),CY-2,W-2*CX*E.ic(p(z,0.8,0.2)),4);al(1);}
  }
}
/* ================= SCENE 2 — logo slam (beats 8–16) ================= */
function s2(t){
  const u=t-bt(8),ex=E.ie(p(u,bt(7.2),B*0.8));
  backdrop(t,C.blue,0.5-0.3*p(u,0,1.2),lerp(3,0.6,E.oc(p(u,0,1.4)))+ex*5);
  shock(CX,CY,u);shock(CX,CY,u-0.12,C.vio,1500,1.0);burst(CX,CY,u,90);
  const m=E.ioc(p(u,bt(2)-0.08,0.42));
  const WM='FLUTON',ws=236,ww=lettersW(WM,ws,{ls:14}),ls=lerp(560,300,m),gap=70;
  const total=300+gap+ww,lx=lerp(CX,CX-total/2+150,m),ly=lerp(CY,CY-30,m);
  ctx.save();ctx.translate(CX,CY);ctx.scale(1+ex*13,1+ex*13);ctx.translate(-CX,-CY);al(1-p(ex,0.5,0.5));
  orb(lx,ly,ls*1.1,C.ice,0.22);
  // spinning tech rings
  const rq=E.oe(p(u,0.15,0.7));
  ctx.save();ctx.translate(lx,ly);al(0.5*rq*(1-p(ex,0.5,0.5)));ctx.strokeStyle=C.ice;ctx.lineWidth=2;
  for(let k=0;k<3;k++){ctx.beginPath();const r=ls*(0.72+k*0.09)*rq,a0=t*(k%2?-0.9:1.3)+k;ctx.arc(0,0,r,a0,a0+TAU*(0.18+k*0.12));ctx.stroke();
    ctx.beginPath();ctx.arc(0,0,r,a0+Math.PI,a0+Math.PI+TAU*0.08);ctx.stroke();}
  ctx.restore();al(1-p(ex,0.5,0.5));
  logo(lx,ly,ls,p(u,0,0.42),p(u,0.07,0.42),p(u,0.14,0.5),{glow:C.ice,blur:60});
  letters(WM,CX-total/2+300+gap,ly,ws,u-bt(2)-0.27,{ls:14,stag:0.045});
  // tagline
  const tq=p(u,bt(4),0.6),TG='UNIVERSAL PRIVACY ENGINE';
  if(tq>0){const y=ly+215;ctx.fillStyle=C.ice;const lw=E.oe(tq)*total;ctx.fillRect(CX-lw/2,y-52,lw,3);
    txt(typed(TG,tq)+(tq<1||Math.floor(u/0.234)%2?'▌':' '),CX-tw(TG+'▌',38,{fam:'JB',wt:500,ls:18})/2,y,38,{fam:'JB',wt:500,ls:18,color:C.ice,align:'left'});}
  ctx.restore();al(1);
}
/* ================= SCENE 3 — encrypted intents (beats 16–24) ================= */
const INT=[['INTENT','SWAP 2,500,000 USDC → ETH'],['FROM','0x71C7656EC7ab…d8976F'],['ROUTE','BASE → ARBITRUM'],['MIN OUT','812.44 ETH']];
function lock(x,y,s,q,col){ // q: 0 open → 1 closed
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=9;ctx.lineCap='round';
  const lift=(1-E.ob(q))*26;ctx.beginPath();ctx.moveTo(-22,-8-lift*0.2);ctx.lineTo(-22,-30-lift);ctx.arc(0,-30-lift,22,Math.PI,0);ctx.lineTo(22,-8-lift*(q<1?1.3:0.2));ctx.stroke();
  rr(-36,-8,72,58,10);ctx.fill();ctx.fillStyle=C.bg;ctx.beginPath();ctx.arc(0,16,8,0,TAU);ctx.fill();ctx.fillRect(-3,18,6,16);ctx.restore();
}
function s3(t){
  const u=t-bt(16),ex=E.ie(p(u,bt(7),B));
  backdrop(t,C.ice,0.06,0);
  sec('01','ENCRYPTED INTENTS',u,1-ex);
  const cw=1240,ch=430,cx=CX,cy=455,en=E.oe(p(u,0.05,0.45));
  const enc=p(u,bt(2),0.75),locked=p(u,bt(3),0.35),col=enc>0?C.ice:C.soft;
  ctx.save();
  const sh=1-ex;ctx.translate(cx+ex*ex*1700,cy);ctx.scale(lerp(1,0.04,E.oc(p(u,bt(7),B*0.55)))*1,en*lerp(1,0.04,E.oc(p(u,bt(7),B*0.55))));ctx.translate(-cx,-cy);
  ctx.shadowColor=C.ice;ctx.shadowBlur=30+60*locked;rr(cx-cw/2,cy-ch/2,cw,ch,22);ctx.fillStyle='rgba(8,14,26,0.92)';ctx.fill();ctx.shadowBlur=0;
  ctx.lineWidth=2+2*locked;ctx.strokeStyle=hexA(C.ice,0.45+0.55*locked);ctx.stroke();
  // header strip
  ctx.fillStyle=hexA(C.ice,0.08);rr(cx-cw/2,cy-ch/2,cw,64,[22,22,0,0]);ctx.fill();
  txt(locked>0?'ENCRYPTED INTENT':'PLAINTEXT INTENT',cx-cw/2+36,cy-ch/2+34,22,{fam:'JB',wt:800,align:'left',ls:6,color:locked>0?C.ice:C.red});
  for(let k=0;k<3;k++){ctx.fillStyle=hexA(C.soft,0.35);ctx.beginPath();ctx.arc(cx+cw/2-40-k*28,cy-ch/2+32,7,0,TAU);ctx.fill();}
  ctx.save();rr(cx-cw/2,cy-ch/2+64,cw,ch-64,[0,0,22,22]);ctx.clip();
  INT.forEach((L,i)=>{const y=cy-ch/2+122+i*80,q=p(u,0.3+i*0.14,0.3);
    al(q);txt(L[0],cx-cw/2+52,y,30,{fam:'JB',wt:500,align:'left',ls:4,color:C.dim});
    const e=p(enc,i*0.12,0.6);
    txt(cipher(typed(L[1],q),e,t,i*31),cx-cw/2+300,y,42,{fam:'JB',wt:800,align:'left',color:e>0?C.ice:C.ink,glow:e>0?C.ice:null,blur:14});});
  al(1);
  if(enc>0&&enc<1){const bx=cx-cw/2+E.ioc(enc)*cw;const g=ctx.createLinearGradient(bx-260,0,bx,0);
    g.addColorStop(0,hexA(C.ice,0));g.addColorStop(1,hexA(C.ice,0.4));ctx.fillStyle=g;ctx.fillRect(bx-260,cy-ch/2,260,ch);ctx.fillStyle='#fff';ctx.fillRect(bx-3,cy-ch/2,6,ch);}
  ctx.restore();
  lock(cx+cw/2-110,cy+ch/2-112,1.5,locked,locked>=1?C.ice:hexA(C.soft,0.6));
  ctx.restore();
  shock(cx,cy,u-bt(3),C.ice,1300,0.7);
  // headline
  const hq=p(u,bt(4),0.35);al(1-p(u,bt(7),0.2));
  punch('ENCRYPTED.',CX,845,208,hq,{glow:C.ice,blur:50,from:1.7});
  const cq=p(u,bt(5.5),0.5);
  txt(typed('FROM CREATION TO SETTLEMENT  ·  NO THIRD PARTY CAN SEE OR COMPUTE YOUR DATA',cq),CX,1000,24,{fam:'JB',wt:500,ls:7,color:C.soft});
  al(1);
  // packet trail on exit
  if(ex>0){const px=cx+ex*ex*1700;const g=ctx.createLinearGradient(px-700,0,px,0);g.addColorStop(0,hexA(C.ice,0));g.addColorStop(1,hexA(C.ice,0.9));

}
